# Runs the same checks as `make test`: Python pytest, plugin bun tests, and tsc.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pytest
        run: python3 -m pip install "pytest>=8"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install plugin dependencies
        working-directory: plugin
        run: bun install --frozen-lockfile

      - name: Test
        run: make test
