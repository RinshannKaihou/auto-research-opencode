[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-research-opencode"
version = "0.1.1"
description = "Research ledger for the OpenCode V2 autonomous research plugin"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "coverage>=7", "black>=24"]

[project.scripts]
ari = "auto_research.maintenance_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["auto_research"]
parallel = true

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
